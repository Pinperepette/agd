[package]
name = "agd"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Agent Document — a line-oriented text format optimized for LLM agents"
license = "MIT"
repository = "https://github.com/pinperepette/agd"
keywords = ["llm", "markup", "agents", "parser", "format"]
categories = ["parser-implementations", "text-processing"]

[lib]
name = "agd"
path = "src/lib.rs"

[[bin]]
name = "agd"
path = "src/bin/agd.rs"

[dependencies]
clap          = { version = "4", features = ["derive"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "1"
anyhow        = "1"
sha1          = "0.10"
pulldown-cmark = "0.10"
tiktoken-rs   = "0.5"
redis         = "0.27"

[dev-dependencies]
insta         = { version = "1", features = ["json"] }
proptest      = "1"
assert_cmd    = "2"
predicates    = "3"
criterion     = { version = "0.5", features = ["html_reports"] }
tempfile      = "3"

[[bench]]
name = "tokens"
harness = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "retrieval"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "agd-bench"
path = "src/bin/agd-bench.rs"

[[bin]]
name = "agdd"
path = "src/bin/agdd.rs"
